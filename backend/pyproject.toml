[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-router-api"
version = "0.1.0"
description = "Backend del AI Router Dashboard: selección automática de modelos de IA."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
    # 8.4: primera versión con --disable-plugin-autoload (ver addopts).
    "pytest>=8.4",
    "httpx>=0.27",
]

# Layout plano: los paquetes viven en la raíz de backend/.
[tool.setuptools]
packages = ["api", "core", "router", "schemas", "services"]
py-modules = ["main"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# No cargar plugins de pytest instalados fuera del proyecto (p. ej. los de ROS 2,
# visibles a través de PYTHONPATH). Si un test necesita uno, se activa con -p.
addopts = ["--disable-plugin-autoload"]
