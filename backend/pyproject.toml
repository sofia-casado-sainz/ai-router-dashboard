[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-router-api"
version = "0.1.0"
description = "Backend del AI Router Dashboard: selección automática de modelos de IA."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
]

[project.optional-dependencies]
dev = [
    # 8.4: primera versión con --disable-plugin-autoload (ver addopts).
    "pytest>=8.4",
    "httpx>=0.27",
    # Base de datos de los tests por defecto (SQLite asíncrono, sin infraestructura).
    "aiosqlite>=0.20",
]

# Layout plano: los paquetes viven en la raíz de backend/.
[tool.setuptools]
packages = ["api", "core", "database", "domain", "providers", "repositories", "router", "schemas", "services"]
py-modules = ["main"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# No cargar plugins de pytest instalados fuera del proyecto (p. ej. los de ROS 2,
# visibles a través de PYTHONPATH). Los que necesita el proyecto se activan con -p:
# anyio ejecuta los tests asíncronos (@pytest.mark.anyio).
addopts = ["--disable-plugin-autoload", "-p", "anyio"]
