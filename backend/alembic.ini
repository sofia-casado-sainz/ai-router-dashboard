# Migraciones de la base de datos (Alembic). Uso, desde backend/:
#   alembic upgrade head                                   aplica las migraciones pendientes
#   alembic revision --autogenerate -m "descripción"       crea una migración nueva
# La URL de conexión sale de Settings (DATABASE_URL o POSTGRES_*), no de este archivo.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
