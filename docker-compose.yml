# Entorno local completo: frontend + backend + PostgreSQL.
# Variables: copia .env.example a .env (docker compose lo lee automáticamente).

services:
  frontend:
    build:
      context: ./frontend
      args:
        # Se incrusta en el bundle al construir: tras cambiarlo, `docker compose build frontend`.
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8010}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:3000}
      # Dentro de la red de compose, PostgreSQL es el servicio `postgres` en el puerto 5432.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-ai_router}
      POSTGRES_USER: ${POSTGRES_USER:-ai_router}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      # Carga el catálogo de modelos de ejemplo al arrancar (idempotente).
      SEED_DATABASE: ${SEED_DATABASE:-true}
    ports:
      - "${BACKEND_PORT:-8010}:8010"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_router}
      POSTGRES_USER: ${POSTGRES_USER:-ai_router}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
